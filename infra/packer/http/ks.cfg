network --bootproto=dhcp --device=ens18 --ipv6=auto --activate

%pre
RHSM_PASSWORD_SERVER=$(cat /proc/cmdline | grep -oP 'rhsm_password_server=\K[^ ]+')
RHSM_PASSWORD=$(curl -sf $RHSM_PASSWORD_SERVER | grep -oP 'password:\s*\K.+' | tr -d '[:space:]')
echo "rhsm --organization=\"20485923\" --activation-key=\"${RHSM_PASSWORD}\"" \
    > /tmp/rhsm-reg.ks
%end

%include /tmp/rhsm-reg.ks

%addon com_redhat_kdump --enable --reserve-mb='auto'
%end

keyboard --vckeymap=us --xlayouts='us'
lang en_SG.UTF-8

text
cdrom

%packages
@^minimal-environment
@standard
cloud-init
%end

firstboot --enable

ignoredisk --only-use=sda
autopart

clearpart --none --initlabel

timesource --ntp-server=singapore-datacenter.serverpoint.com
timezone Asia/Singapore --utc

rootpw --lock
user --groups=wheel --name=kanna --password $y$j9T$lH5WhBYC8YwjLnysJ9pKM7n7$otMrcslIkVaNB1Zkx4VxoFI0C6GvuWaqzPZeppAD7k1 --iscrypted --gecos="kanna"

%post
systemctl enable cloud-init
subscription-manager unregister
subscription-manager clean
%end

reboot --eject